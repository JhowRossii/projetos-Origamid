<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela Técnico</title>
  <link rel="stylesheet" href="./styles/tela_tecnico.css">
</head>
<body>

  <!-- INFORMAÇÕES DO TÉCNICO -->
  <div class="info">
    <h1>TELA TECNICO</h1>
    <p>Nome do técnico</p>
    <p>Matrícula</p>
  </div>

  <!-- CARDS CENTRALIZADOS -->
  <div class="cards">

    <div class="card">
      <img src="./img/360526306_11452734.png" alt="Honda Civic">
      <div>
        <h1>ABC-1234</h1>
        <h2>Honda Civic</h2>
        <span>120.000 km</span>
        <button class="disponivel">Disponível</button>
      </div>
    </div>

    <div class="card">
      <img src="./img/4076.jpg" alt="Ford Fiesta">
      <div>
        <h1>XYZ-5678</h1>
        <h2>Ford Fiesta</h2>
        <span>95.000 km</span>
        <button class="indisponivel" disabled>Indisponível</button>
      </div>
    </div>

    <div class="card">
      <img src="./img/hellio42-ai-generated-8674235.png" alt="Chevrolet Onix">
      <div>
        <h1>QWE-9090</h1>
        <h2>Chevrolet Onix</h2>
        <span>60.000 km</span>
        <button class="disponivel">Disponível</button>
      </div>
    </div>

  </div>

</body>
</html>
