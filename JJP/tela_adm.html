<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela ADM</title>

  <link rel="stylesheet" href="./styles/tela_adm.css">
</head>

<body>

  <!-- INFO NO TOPO -->
  <div class="info">
    <h1>TELA TECNICO</h1>
    <p>Nome do técnico</p>
    <p>Matrícula</p>
  </div>

  <!-- FORM CENTRALIZADO -->
  <div class="content">
    <form action="">
      <fieldset>
        <legend>Dados Do Veículo</legend>

        <div class="row">
          <label for="Placa">Placa</label>
          <input type="text" id="Placa" name="Placa" placeholder="Digite a placa do veículo" autocomplete="off" required>
        </div>

        <div class="row">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" name="modelo" placeholder="Digite o modelo do veículo" autocomplete="off" required>
        </div>

        <div class="row">
          <label for="KM">KM</label>
          <input type="text" id="KM" name="KM" placeholder="Digite o KM inicial" autocomplete="off" required>
        </div>

        <div class="row">
          <label for="dtCadastro">Data de Cadastro</label>
          <input type="date" id="dtCadastro" name="dtCadastro">
        </div>

        <div class="row">
          <input type="file" accept="image/*">
        </div>

      </fieldset>

      <div class="buttons">
        <input type="submit">
        <input type="reset" value="Limpar">
      </div>
    </form>
  </div>

</body>

</html>
